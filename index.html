<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGDM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235600b2'/%3E%3Cpath d='M14 7h4v7h7v4h-7v7h-4v-7H7v-4h7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202611110837">
</head>
<body>
<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="login-logo-icon"><span class="ms">local_hospital</span></div>
    <div class="login-title">SGDM</div>
    <div class="login-subtitle">Sistema de Gestão de Documentos Médicos</div>
    <form class="login-form" id="loginForm">
      <div class="input-group"><label for="lu">Usuário</label><input id="lu" placeholder="Digite seu usuário" autocomplete="username" autofocus></div>
      <div class="input-group"><label for="lp">Senha</label><input id="lp" type="password" placeholder="Digite sua senha" autocomplete="current-password"></div>
      <button class="login-btn" type="submit">Entrar</button>
      <div class="err" id="lerr" hidden>Usuário ou senha incorretos.</div>
    </form>
  </div>
  <div class="login-info">SGDM</div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><i><span class="ms">medical_services</span></i><div>SGDM<small>Gestão médica</small></div></div>
      <div class="unit-wrap"><span class="unit-l">Local</span><div class="seg" id="unit" aria-label="Local de atendimento"></div></div>
      <div class="spacer"></div>
      <button class="ghost" id="themeBtn" title="Alternar tema"><span class="ms">contrast</span></button>
      <button class="ghost" id="logoutBtn"><span class="ms">logout</span>Sair</button>
    </div>
    <nav class="mods" role="tablist" id="mods"></nav>
  </header>
  <section class="pt" aria-label="Paciente em atendimento">
    <h3><span class="ms" style="font-size:16px">badge</span>Paciente em atendimento<span class="priv"><span class="ms" style="font-size:14px">lock</span> Não é gravado. Fica só nesta aba.</span></h3>
    <div class="f wide"><label for="pNome">Nome do paciente</label><input id="pNome" placeholder="Nome completo" autocomplete="off"></div>
    <div class="f" style="flex:0 0 auto"><button class="btn quiet" id="clearPt"><span class="ms">delete_sweep</span>Novo paciente</button></div>
  </section>
  <main id="view"></main>
</div>
<div class="ov-back" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<iframe id="printFrame" title="impressão" style="position:absolute;width:0;height:0;border:0;left:-9999px"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=202611110837"></script>
<script src="js/data.js?v=202611110837"></script>
<script src="js/forms.js?v=202611110837"></script>
<script src="js/engine.js?v=202611110837"></script>
<script src="js/app.js?v=202611110837"></script>
<script src="js/apac.js?v=202611110837"></script>
<script src="js/scc.js?v=202611110837"></script>
<script src="js/cad.js?v=202611110837"></script>
</body>
</html>
